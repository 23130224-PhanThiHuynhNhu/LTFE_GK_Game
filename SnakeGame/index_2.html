<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake - Level 2</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
<div class="container" id="container">

    <!--Header-->
    <header class="game-header">

        <div class="game-name">
            <span>Snake Game</span>
        </div>

        <div class="header-right">

            <div class="high-score">
                <i class="fa-solid fa-trophy"></i>
                <div>
                    <small>High Score</small>
                    <strong id="high-score">0</strong>
                </div>
            </div>

            <a href="menu.html" class="setting" title="Quay về Menu">
                <i class="fa-solid fa-house"></i>
            </a>

            <button class="setting" id="setting">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

    </header>

    <section class="game-info">

        <div class="info-box level-box">
            <i class="info-icon fa fa-level-up" aria-hidden="true"></i>

            <div>
                <span class="label">LEVEL</span>
                <strong id="level">2</strong>
            </div>
        </div>

        <div class="info-box score-box">
            <i class="info-icon fa-regular fa-star"></i>
            <div>
                <span class="label">SCORE</span>
                <strong id="score">40</strong>
            </div>
        </div>


        <div class="info-box target-box">
            <i class="info-icon fa-solid fa-bullseye"></i>

            <div>
                <span class="label">TARGET</span>
                <strong id="target">100</strong>
            </div>
        </div>


        <div class="info-box status-box">
            <i class="info-icon fa-solid fa-gamepad"></i>

            <div>
                <span class="label">STATUS</span>
                <strong id="game-status">PLAYING</strong>
            </div>
        </div>
    </section>


    <main class="game-board">
        <div class="game-board-wrapper">
            <div class="board-top">
                <span>Snake</span>
                <span class="board-score">
                    SCORE:
                    <strong id="board-score">0</strong>
                </span>
            </div>


            <div id="game-board">

                <div id="snake-game">

                    <div id="game-area">
                        <!--Tạo rắn và mồi bằng JS -->
                    </div>

                </div>

            </div>

        </div>

        <section class="controls">

            <button id="pause-button" class="game-btn pause-button">
                <i class="fa-solid fa-pause"></i>
                PAUSE
            </button>

            <button id="restart-button" class="game-btn restart-button">
                <i class="fa-solid fa-rotate-right"></i>
                RESTART
            </button>
        </section>
    </main>

</div>


<div class="modal fade"
     id="gameOverModal"
     tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content game-modal">
            <div class="modal-body">
                <div class="modal-icon">
                    <i class="fa-solid fa-skull-crossbones"></i>
                </div>

                <h2>GAME OVER</h2>
                <p>Your snake couldn't make it this time.</p>

                <div class="final-score">
                    <span>FINAL SCORE</span>
                    <strong id="final-score">0</strong>

                </div>
                <button id="modal-restart"
                        class="modal-btn">
                    <i class="fa-solid fa-rotate-right"></i>
                    PLAY AGAIN

                </button>

            </div>
        </div>
    </div>

</div>

<div class="modal fade"
     id="levelCompleteModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content game-modal">
            <div class="modal-body">
                <div class="modal-icon">
                    <i class="fa-solid fa-medal"></i>
                </div>
                <h2> LEVEL 2 COMPLETE </h2>
                <p> Congratulations! You reached the target score. </p>

                <div class="final-score">
                    <span> SCORE </span>
                    <strong id="complete-score"> 200 </strong>

                </div>

                <div class="modal-actions">
                    <button id="complete-restart" class="modal-btn btn-secondary">
                        <i class="fa-solid fa-rotate-right"></i>
                        PLAY AGAIN
                    </button>

                    <button id="complete-next" class="modal-btn btn-primary">
                        <i class="fa-solid fa-arrow-right-long"></i>
                        NEXT LEVEL
                    </button>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Snake JS -->
<script src="snake.js"></script>

</body>
</html>
