<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Game - Select Level</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body class="menu-body">

<div class="menu-card">
    <i class="fa-solid fa-gamepad menu-logo"></i>
    <h1 class="menu-title">SNAKE GAME</h1>
    <p class="menu-subtitle">Chọn cấp độ để bắt đầu thử thách</p>

    <div class="level-list">
        <a href="index.html?level=1" class="level-btn">
            <div class="level-badge">1</div>
            <div class="level-info">
                <h3>LEVEL 1</h3>
                <span>Tốc độ: Thường | Target: 100 điểm</span>
            </div>
            <i class="fa-solid fa-play play-icon"></i>
        </a>

        <a href="index_2.html?level=2" class="level-btn">
            <div class="level-badge">2</div>
            <div class="level-info">
                <h3>LEVEL 2</h3>
                <span>Tốc độ: Vừa | Có ma trận tường | Target: 200 điểm</span>
            </div>
            <i class="fa-solid fa-play play-icon"></i>
        </a>

        <a href="index_3.html?level=3" class="level-btn">
            <div class="level-badge">3</div>
            <div class="level-info">
                <h3>LEVEL 3</h3>
                <span>Tốc độ: Nhanh | Tường dịch chuyển vào giữa theo thời gian | Target: 300 điểm</span>
            </div>
            <i class="fa-solid fa-play play-icon"></i>
        </a>
    </div>
</div>
</body>
</html>
